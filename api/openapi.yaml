  /api/v1/imports/{id}/undo:
    post:
      tags: [Statement imports]
      operationId: undoStatementImport
      summary: Remove only the ledger rows created by this import
      description: |
        Requires an explicit user confirmation in the app. Deletes only this
        user's imported transaction IDs in one transaction and recalculates the
        balance; the account's opening balance and unrelated operations remain
        untouched. Keeps import history. Repeating undo is safe. A fresh import
        may intentionally import the same source again after undo.

openapi: 3.0.3
info:
  title: MoneyFlow API
  version: 0.4.0
  description: |
    Android MVP API. PostgreSQL is the authoritative store. All authenticated
    reads and writes are scoped to the authenticated user; a client cannot send
    a user ID to choose another owner. Ownership failures return 404.

    Money travels as canonical base-10 integer strings in minor units to avoid
    floating-point rounding. Supported currencies are KZT, USD, EUR, JPY, KWD,
    RUB, GBP, CHF, AUD, CAD, and CNY. JPY has zero minor-unit decimal places,
    KWD has three, and the other supported currencies have two. Individual amounts and opening balances are
    limited to 1,000,000,000,000,000 minor units. Calculated balances use signed
    64-bit integers. Writes that would overflow a balance are rejected atomically.

    Requests contain one JSON object and reject unknown fields. Ordinary writes
    have a 16 KiB body limit; normalized statement import writes allow 2 MiB and
    at most 2000 rows. Original PDF files are parsed on Android and never uploaded
    to this API. RFC3339 timestamps include a timezone. Authentication tokens are
    opaque bearer credentials with an expiry; logout revokes the current token.

    Frankfurter v2 supplies daily reference rates, cached persistently in
    PostgreSQL using USD anchors. Converted views never alter original ledger
    amounts. Conversion uses exact rational arithmetic and rounds to target
    minor units with round-half-to-even. Missing rates produce an explicitly
    incomplete portfolio, never a fabricated total. Provider rate dates and
    snapshot fetch time are distinct; identity conversions need no provider.
servers:
  - url: http://localhost:8080
    description: Local development; Android emulator uses http://10.0.2.2:8080
  - url: https://api.example.com
    description: Replace with your HTTPS production domain
tags:
  - name: Health
  - name: Authentication
  - name: Accounts
  - name: Transactions
  - name: Transfers
  - name: Categories
  - name: Analytics
  - name: Statement imports
  - name: Currencies
  - name: Preferences
  - name: Portfolio
security:
  - bearerAuth: []
paths:
  /healthz:
    get:
      tags: [Health]
      operationId: health
      summary: Check process liveness
      security: []
      responses:
        '200':
          description: The HTTP process is running; does not query the database.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
  /readyz:
    get:
      tags: [Health]
      operationId: readiness
      summary: Check database readiness
      security: []
      responses:
        '200':
          description: The API can reach PostgreSQL.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
        '503':
          description: PostgreSQL is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/auth/register:
    post:
      tags: [Authentication]
      operationId: register
      summary: Register a user and start a session
      security: []
      requestBody:
        $ref: '#/components/requestBodies/Credentials'
      responses:
        '201':
          $ref: '#/components/responses/SessionCreated'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: An account already exists for the normalized email address.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '504':
          $ref: '#/components/responses/RequestTimeout'
  /api/v1/auth/login:
    post:
      tags: [Authentication]
      operationId: login
      summary: Start a session using email and password
      security: []
      requestBody:
        $ref: '#/components/requestBodies/Credentials'
      responses:
        '200':
          $ref: '#/components/responses/SessionCreated'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: The email or password is incorrect.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '504':
          $ref: '#/components/responses/RequestTimeout'
  /api/v1/auth/logout:
    post:
      tags: [Authentication]
      operationId: logout
      summary: Revoke the current session
      responses:
        '204':
          description: Session revoked; response has no body.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
        '504':
          $ref: '#/components/responses/RequestTimeout'
  /api/v1/me:
    get:
      tags: [Authentication]
      operationId: currentUser
      summary: Read the authenticated user
      responses:
        '200':
          description: Authenticated user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
        '504':
          $ref: '#/components/responses/RequestTimeout'
  /api/v1/accounts:
    get:
      tags: [Accounts]
      operationId: listAccounts
      summary: List the authenticated user's accounts and current balances
      responses:
        '200':
          description: An empty list is returned when the user has no accounts.
          content:
            application/json:
              schema:
                type: object
                required: [accounts]
                additionalProperties: false
                properties:
                  accounts:
                    type: array
                    items:
                      $ref: '#/components/schemas/Account'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
        '504':
          $ref: '#/components/responses/RequestTimeout'
    post:
      tags: [Accounts]
      operationId: createAccount
      summary: Create an account
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          schema: {type: string, format: uuid}
          description: Recommended. Retain one key and exact body until acknowledged; identical retries return the saved entity.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAccount'
            example:
              name: Cash
              currency: KZT
              opening_balance_minor: '500000'
      responses:
        '201':
          description: Account created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/InternalError'
        '504':
          $ref: '#/components/responses/RequestTimeout'
  /api/v1/transactions:
    get:
      tags:
      - Transactions
      operationId: listTransactions
      summary: Search all owned account history using stable keyset pagination
      parameters:
      - name: account_id
        in: query
        required: false
        schema:
          type: string
          format: uuid
      - name: category_id
        in: query
        required: false
        schema:
          type: string
          format: uuid
      - name: kind
        in: query
        required: false
        schema:
          type: string
          enum:
          - expense
          - income
      - name: q
        in: query
        required: false
        schema:
          type: string
          maxLength: 100
      - name: from
        in: query
        required: false
        schema:
          type: string
          format: date-time
      - name: to
        in: query
        required: false
        schema:
          type: string
          format: date-time
      - name: cursor
        in: query
        required: false
        schema:
          type: string
          maxLength: 2048
      - name: include_deleted
        in: query
        required: false
        schema:
          type: boolean
          default: false
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 50
      responses:
        '200':
          description: History page; next_cursor null means complete.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '504':
          $ref: '#/components/responses/RequestTimeout'
      description: Includes archived account/category history. Active rows are returned by default. include_deleted=true
        also returns soft-deleted rows for restoration. from is inclusive, to exclusive. Root category filters include
        its children. q is literal case-insensitive text across note, account, effective category name and minor amount.
        A cursor is valid only for the same filters. Deleted rows never affect balances or analytics.
    post:
      tags: [Transactions]
      operationId: createTransaction
      summary: Record an income or expense exactly once
      description: |
        Generate an Idempotency-Key UUID once per intended transaction and retain
        it until the result is known. Retry the same request with the same key
        after an uncertain network result. An identical retry returns the
        original transaction and status 201. The same key with different data
        returns 409. Keys are scoped to the authenticated user. Account currency
        is inferred by the server and cannot be overridden in this request.
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTransaction'
            example:
              account_id: 69739b8c-8d9c-4adc-930c-f8c37e9dd8f1
              kind: expense
              amount_minor: '1299'
              note: Lunch
              occurred_at: '2026-10-09T12:30:00+05:00'
      responses:
        '201':
          description: Transaction created, or the result of an identical retry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transaction'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Idempotency key reused with different data, or balance overflow.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/InternalError'
        '504':
          $ref: '#/components/responses/RequestTimeout'
  /api/v1/categories:
    get:
      tags: [Categories]
      operationId: listCategories
      summary: List standard and private custom categories
      responses:
        '200':
          description: Expense roots and their subcategories, and flat income categories.
          content:
            application/json:
              schema:
                type: object
                required: [categories]
                additionalProperties: false
                properties:
                  categories:
                    type: array
                    items:
                      $ref: '#/components/schemas/Category'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
        '504':
          $ref: '#/components/responses/RequestTimeout'
    post:
      tags: [Categories]
      operationId: createCategory
      summary: Create a private category or expense subcategory
      description: |
        Expense categories have at most two levels. A parent must be a visible
        expense root. Income categories have no parent. Names are trimmed and
        must be unique within the same kind and parent for this user, including
        visible standard categories. Custom categories are private to their owner.
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          schema: {type: string, format: uuid}
          description: Recommended. Retain one key and exact body until acknowledged; identical retries return the saved entity.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCategory'
            example:
              kind: expense
              name: Покупка автомобиля
              parent_id: null
      responses:
        '201':
          description: Custom category created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: A category with this name already exists at the same level.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/InternalError'
        '504':
          $ref: '#/components/responses/RequestTimeout'
  /api/v1/transactions/{id}/category:
    put:
      tags: [Transactions, Categories]
      operationId: assignTransactionCategory
      summary: Assign or clear the category of an existing transaction
      description: The category must be visible to the user and match the transaction kind. A null or omitted category_id clears the classification. Only classification changes; ledger amounts and balances are preserved.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                category_id:
                  $ref: '#/components/schemas/NullableCategoryID'
      responses:
        '200':
          description: Updated transaction.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transaction'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/InternalError'
        '504':
          $ref: '#/components/responses/RequestTimeout'
  /api/v1/analytics:
    get:
      tags: [Analytics]
      operationId: monthlyAnalytics
      summary: Summarize monthly income and expenses by category in one native currency
      description: |
        Includes all the user's transactions in the requested calendar month
        and account currency, independently of transaction-list pagination.
        Opening balances are excluded. No exchange-rate conversion is applied.
        Expense roots include subcategory spending exactly once; children list
        only amounts explicitly assigned to subcategories. Uncategorized
        transactions form a separate bucket. Nonempty buckets are sorted by
        descending amount. Amounts are exact nonnegative signed-64-bit integers.
      parameters:
        - name: month
          in: query
          required: true
          schema:
            type: string
            pattern: '^[0-9]{4}-(0[1-9]|1[0-2])$'
            example: '2026-10'
        - name: currency
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/Currency'
        - name: timezone
          in: query
          required: false
          schema:
            type: string
            default: UTC
            example: Asia/Qyzylorda
          description: IANA timezone used to calculate the start and end of the calendar month.
      responses:
        '200':
          description: Monthly totals and category breakdowns; empty months return zero totals and empty lists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MonthlyAnalytics'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: Analytics totals exceed the supported signed-64-bit range.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'
        '504':
          $ref: '#/components/responses/RequestTimeout'
  /api/v1/currencies:
    get:
      tags: [Currencies]
      operationId: listCurrencies
      summary: List the supported currency catalog
      responses:
        '200':
          description: Curated application catalog; does not query the provider.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrencyCatalog'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
        '504':
          $ref: '#/components/responses/RequestTimeout'
  /api/v1/preferences:
    get:
      tags: [Preferences]
      operationId: getPreferences
      summary: Read the authenticated user's base currency
      responses:
        '200':
          description: KZT is the default for new and existing users without a saved preference.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Preferences'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
        '504':
          $ref: '#/components/responses/RequestTimeout'
    put:
      tags: [Preferences]
      operationId: updatePreferences
      summary: Save the authenticated user's portfolio base currency
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Preferences'
            example:
              base_currency: KZT
      responses:
        '200':
          description: Saved preference; account currencies and original ledger amounts are unchanged.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Preferences'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/InternalError'
        '504':
          $ref: '#/components/responses/RequestTimeout'
  /api/v1/exchange-rates:
    get:
      tags: [Currencies]
      operationId: getExchangeRates
      summary: Read available rates from a base currency
      description: |
        Rates express quote major units per one base major unit. A usable
        cached snapshot is returned with stale=true when refreshing fails.
        Missing or too old quotes are listed in missing_currencies; a provider
        outage still returns 200 with the available rates, including identity.
        Cross rates use USD anchors; rate_date is the older anchor date.
      parameters:
        - $ref: '#/components/parameters/BaseCurrency'
      responses:
        '200':
          description: Available rates and explicit missing currencies.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExchangeRates'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
        '504':
          $ref: '#/components/responses/RequestTimeout'
  /api/v1/convert:
    post:
      tags: [Currencies]
      operationId: convertAmount
      summary: Preview a conversion without creating a ledger transaction
      description: |
        Accepts canonical signed minor units with absolute value at most 10^15.
        Exact rational conversion rounds to the target currency's minor units
        using round-half-to-even. Converted output must fit signed int64.
        Identity conversions return rate='1', null dates/fetched_at, stale=false.
        An unavailable non-identity rate returns 503; no invented rate is used.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConversionRequest'
            example:
              from_currency: USD
              to_currency: KZT
              amount_minor: '10000'
      responses:
        '200':
          description: Conversion preview; no financial records are written.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Conversion'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/ConversionOverflow'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '503':
          $ref: '#/components/responses/RatesUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'
        '504':
          $ref: '#/components/responses/RequestTimeout'
  /api/v1/portfolio:
    get:
      tags: [Portfolio]
      operationId: getPortfolio
      summary: Value the authenticated user's account balances in one base currency
      description: |
        Defaults to the saved user preference, initially KZT. Original balance
        amounts remain in each account's currency. Each converted account is
        rounded to target minor units before summing. Missing rates return 200,
        complete=false and total_balance_minor=null; partial_balance_minor is
        the sum of accounts with available rates. Signed int64 overflow returns
        409 conversion_overflow. An empty portfolio is complete with total '0'.
      parameters:
        - $ref: '#/components/parameters/BaseCurrency'
      responses:
        '200':
          description: Complete total or explicitly incomplete valuation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Portfolio'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/ConversionOverflow'
        '500':
          $ref: '#/components/responses/InternalError'
        '504':
          $ref: '#/components/responses/RequestTimeout'
  /api/v1/imports/preview:
    post:
      tags: [Statement imports]
      operationId: previewStatementImport
      summary: Validate normalized PDF rows and identify duplicates without changing the ledger
      description: |
        Supports the Kaspi/Halyk KZT templates parsed on Android. Stores an
        owner-scoped draft for 24 hours. Exact duplicates refer to a currently
        existing imported transaction with the same account, file SHA-256 and
        source row ID. Date/direction/amount matches in the full ledger are only
        possible duplicates; identical genuine purchases remain separate rows.
        Opening and closing statement balances are informational and do not
        change an existing account's opening balance.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StatementPreviewRequest'
      responses:
        '201':
          description: Draft created; no financial transactions were added.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatementPreview'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '413':
          $ref: '#/components/responses/ImportPayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '504':
          $ref: '#/components/responses/RequestTimeout'
  /api/v1/imports:
    get:
      tags: [Statement imports]
      operationId: listStatementImports
      summary: List the current user's import history
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Import metadata, newest first; normalized row payloads are omitted.
          content:
            application/json:
              schema:
                type: object
                required: [imports]
                properties:
                  imports:
                    type: array
                    items:
                      $ref: '#/components/schemas/StatementImportReceipt'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/imports/{id}/commit:
    post:
      tags: [Statement imports]
      operationId: commitStatementImport
      summary: Atomically save the selected rows after review
      description: |
        The owner, account, categories, balance range and live duplicate set are
        checked again while the account is locked. Exact selected duplicates or
        possible duplicates without explicit permission reject the entire batch.
        A changed candidate set requires a fresh preview. Repeating the same
        request and Idempotency-Key returns the saved receipt. Changing an
        already committed selection conflicts; an undone import cannot be
        recreated by replaying its old commit. exclude_from_analytics is an
        explicit user classification for own-account transfers/cash movements:
        the row still affects the account balance but is omitted from charts.
      parameters:
        - $ref: '#/components/parameters/StatementImportID'
        - $ref: '#/components/parameters/StatementImportKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StatementCommitRequest'
      responses:
        '201':
          description: All selected rows saved, or the original successful receipt replayed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatementImportReceipt'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/StatementImportConflict'
        '410':

components:
  parameters:
    StatementImportID:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    StatementImportKey:
      name: Idempotency-Key
      in: header
      required: true
      description: One UUID; retain the exact key and payload after an uncertain network response.
      schema:
        type: string
        format: uuid
    BaseCurrency:
      name: base
      in: query
      required: false
      description: Base currency. If omitted, uses the authenticated user's preference (initially KZT).
      schema:
        $ref: '#/components/schemas/Currency'
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: Use the access_token returned from registration or login.
  requestBodies:
    Credentials:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Credentials'
  responses:
    ImportPayloadTooLarge:
      description: Normalized import JSON exceeds 2 MiB; raw PDF uploads are unsupported.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    StatementImportConflict:
      description: Duplicate, changed preview, incompatible import state, reused key with a changed request, or ledger balance overflow; no partial batch was committed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    StatementImportExpired:
      description: The draft has expired; obtain a new preview before committing.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    RatesUnavailable:
      description: No usable rate is available for this conversion; error.code is rates_unavailable.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ConversionOverflow:
      description: Converted amount or portfolio sum cannot fit signed int64; error.code is conversion_overflow.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    SessionCreated:
      description: New authenticated session.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Session'
    BadRequest:
      description: Invalid JSON, unknown fields, missing fields, or validation failure.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Bearer token is missing, invalid, expired, or revoked.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Resource does not exist or belongs to another user.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    PayloadTooLarge:
      description: Request body exceeds 16 KiB.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    TooManyRequests:
      description: Too many authentication attempts from this remote address.
      headers:
        Retry-After:
          description: Seconds before trying again.
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    UnsupportedMediaType:
      description: Content-Type must be application/json.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    RequestTimeout:
      description: Request exceeded its processing deadline. Retry uncertain transaction writes using the same idempotency key.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InternalError:
      description: Unexpected server or database error; sensitive details are omitted.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string
          example: ok
    Credentials:
      type: object
      required: [email, password]
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
          maxLength: 254
          description: One ASCII email address, trimmed and lowercased by the server.
          example: developer@example.com
        password:
          type: string
          format: password
          description: Between 12 and 128 UTF-8 bytes. Passwords are not trimmed.
          writeOnly: true
    User:
      type: object
      required: [id, email]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
    Session:
      type: object
      required: [access_token, expires_at, user]
      additionalProperties: false
      properties:
        access_token:
          type: string
          description: Opaque secret. Send it in the Authorization bearer header.
        expires_at:
          type: string
          format: date-time
        user:
          $ref: '#/components/schemas/User'
    Currency:
      type: string
      enum: [KZT, USD, EUR, JPY, KWD, RUB, GBP, CHF, AUD, CAD, CNY]
    CurrencyMetadata:
      type: object
      additionalProperties: false
      required: [code, name, symbol, fraction_digits]
      properties:
        code:
          $ref: '#/components/schemas/Currency'
        name:
          type: string
          description: English currency name.
          example: Kazakhstani Tenge
        symbol:
          type: string
          example: ₸
        fraction_digits:
          type: integer
          enum: [0, 2, 3]
    CurrencyCatalog:
      type: object
      additionalProperties: false
      required: [provider, currencies]
      properties:
        provider:
          type: string
          enum: [Frankfurter]
        currencies:
          type: array
          items:
            $ref: '#/components/schemas/CurrencyMetadata'
    Preferences:
      type: object
      additionalProperties: false
      required: [base_currency]
      properties:
        base_currency:
          $ref: '#/components/schemas/Currency'
    Rate:
      type: string
      pattern: '^(?:[1-9][0-9]*(?:\.[0-9]+)?|0\.[0-9]*[1-9][0-9]*)$'
      description: Positive decimal string without an exponent; quote major units per base major unit. Display precision can differ from exact internal rational conversion.
      example: '491.275'
    RateDate:
      type: string
      format: date
      nullable: true
      description: Provider observation date; cross rates use the older of both USD-anchor dates. Null for identity or unavailable rates.
    SnapshotFetchedAt:
      type: string
      format: date-time
      nullable: true
      description: Fetch time of the snapshot within the cache age limit, distinct from its observation dates. Individual old quotes can still be unavailable. Null when no usable-age snapshot exists or a conversion/portfolio needs only identity rates.
    ExchangeRate:
      type: object
      additionalProperties: false
      required: [quote_currency, rate, rate_date]
      properties:
        quote_currency:
          $ref: '#/components/schemas/Currency'
        rate:
          $ref: '#/components/schemas/Rate'
        rate_date:
          $ref: '#/components/schemas/RateDate'
    ExchangeRates:
      type: object
      additionalProperties: false
      required: [base_currency, provider, fetched_at, stale, rates, missing_currencies]
      properties:
        base_currency:
          $ref: '#/components/schemas/Currency'
        provider:
          type: string
          enum: [Frankfurter]
        fetched_at:
          $ref: '#/components/schemas/SnapshotFetchedAt'
        stale:
          type: boolean
          description: The usable snapshot is older than FX_CACHE_TTL. Provider observation dates remain independently visible and are excluded when older than FX_MAX_STALE.
        rates:
          type: array
          items:
            $ref: '#/components/schemas/ExchangeRate'
        missing_currencies:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/Currency'
    ConversionRequest:
      type: object
      additionalProperties: false
      required: [from_currency, to_currency, amount_minor]
      properties:
        from_currency:
          $ref: '#/components/schemas/Currency'
        to_currency:
          $ref: '#/components/schemas/Currency'
        amount_minor:
          $ref: '#/components/schemas/OpeningMinorBalance'
    Conversion:
      type: object
      additionalProperties: false
      required: [from_currency, to_currency, amount_minor, converted_amount_minor, rate, rate_date, fetched_at, stale, provider]
      properties:
        from_currency:
          $ref: '#/components/schemas/Currency'
        to_currency:
          $ref: '#/components/schemas/Currency'
        amount_minor:
          $ref: '#/components/schemas/OpeningMinorBalance'
        converted_amount_minor:
          $ref: '#/components/schemas/CalculatedMinorBalance'
        rate:
          $ref: '#/components/schemas/Rate'
        rate_date:
          $ref: '#/components/schemas/RateDate'
        fetched_at:
          $ref: '#/components/schemas/SnapshotFetchedAt'
        stale:
          type: boolean
        provider:
          type: string
          enum: [Frankfurter]
    PortfolioAccount:
      type: object
      additionalProperties: false
      required: [id, name, currency, balance_minor, converted_balance_minor, rate, rate_date]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        currency:
          $ref: '#/components/schemas/Currency'
        balance_minor:
          $ref: '#/components/schemas/CalculatedMinorBalance'
        converted_balance_minor:
          type: string
          nullable: true
          pattern: '^(?:0|-?[1-9][0-9]{0,18})$'
          maxLength: 20
          description: Signed int64 minor units of the portfolio base currency; null if the rate is unavailable.
        rate:
          type: string
          nullable: true
          pattern: '^(?:[1-9][0-9]*(?:\.[0-9]+)?|0\.[0-9]*[1-9][0-9]*)$'
          description: Base major units per original account major unit; null if unavailable.
        rate_date:
          $ref: '#/components/schemas/RateDate'
    Portfolio:
      type: object
      additionalProperties: false
      required: [base_currency, provider, fetched_at, stale, complete, total_balance_minor, partial_balance_minor, missing_currencies, accounts]
      properties:
        base_currency:
          $ref: '#/components/schemas/Currency'
        provider:
          type: string
          enum: [Frankfurter]
        fetched_at:
          $ref: '#/components/schemas/SnapshotFetchedAt'
        stale:
          type: boolean
        complete:
          type: boolean
          description: True only when every account has an available conversion.
        total_balance_minor:
          type: string
          nullable: true
          pattern: '^(?:0|-?[1-9][0-9]{0,18})$'
          maxLength: 20
          description: Total in base minor units; null whenever complete=false.
        partial_balance_minor:
          $ref: '#/components/schemas/CalculatedMinorBalance'
        missing_currencies:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/Currency'
        accounts:
          type: array
          items:
            $ref: '#/components/schemas/PortfolioAccount'
    PositiveMinorAmount:
      type: string
      pattern: '^(?:[1-9][0-9]{0,14}|1000000000000000)$'
      maxLength: 16
      description: Canonical positive integer string, at most 10^15 minor units.
      example: '1299'
    OpeningMinorBalance:
      type: string
      pattern: '^(?:0|-?(?:[1-9][0-9]{0,14}|1000000000000000))$'
      maxLength: 17
      description: Canonical integer string with absolute value at most 10^15. Negative zero is invalid.
      example: '0'
    CalculatedMinorBalance:
      type: string
      pattern: '^(?:0|-?[1-9][0-9]{0,18})$'
      maxLength: 20
      description: Canonical signed 64-bit integer string, from -9223372036854775808 to 9223372036854775807.
      example: '48701'
    CreateAccount:
      type: object
      required:
      - name
      - currency
      - opening_balance_minor
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: Trimmed before validation; 1 to 100 Unicode characters.
        currency:
          $ref: '#/components/schemas/Currency'
        opening_balance_minor:
          allOf:
          - $ref: '#/components/schemas/OpeningMinorBalance'
        type:
          type: string
          enum:
          - card
          - cash
          - savings
          - credit
          - other
          default: card
    Account:
      type: object
      required:
      - id
      - name
      - currency
      - opening_balance_minor
      - balance_minor
      - created_at
      - type
      - archived
      - include_in_balance
      - sort_order
      - version
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        currency:
          $ref: '#/components/schemas/Currency'
        opening_balance_minor:
          $ref: '#/components/schemas/OpeningMinorBalance'
        balance_minor:
          $ref: '#/components/schemas/CalculatedMinorBalance'
        created_at:
          type: string
          format: date-time
        type:
          type: string
          enum:
          - card
          - cash
          - savings
          - credit
          - other
        archived:
          type: boolean
        include_in_balance:
          type: boolean
        sort_order:
          type: integer
          format: int32
        version:
          type: integer
          format: int64
          minimum: 1
    TransactionKind:
      type: string
      enum: [expense, income]
    NullableCategoryID:
      type: string
      format: uuid
      nullable: true
      description: Category or expense subcategory identifier; null means uncategorized.
    CreateCategory:
      type: object
      required: [kind, name]
      additionalProperties: false
      properties:
        kind:
          $ref: '#/components/schemas/TransactionKind'
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: Trimmed Unicode name.
        parent_id:
          $ref: '#/components/schemas/NullableCategoryID'
    Category:
      type: object
      required:
      - id
      - kind
      - name
      - parent_id
      - is_default
      - archived
      - sort_order
      - version
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        kind:
          $ref: '#/components/schemas/TransactionKind'
        name:
          type: string
          minLength: 1
          maxLength: 100
        parent_id:
          $ref: '#/components/schemas/NullableCategoryID'
        is_default:
          type: boolean
        archived:
          type: boolean
        sort_order:
          type: integer
          format: int32
        version:
          type: integer
          format: int64
          minimum: 1
    AnalyticsMinorAmount:
      type: string
      pattern: '^(0|[1-9][0-9]{0,18})$'
      maxLength: 19
      description: Exact nonnegative integer in minor units, at most 9223372036854775807.
    AnalyticsBucket:
      type: object
      required: [category_id, name, amount_minor, children]
      additionalProperties: false
      properties:
        category_id:
          $ref: '#/components/schemas/NullableCategoryID'
        name:
          type: string
        amount_minor:
          $ref: '#/components/schemas/AnalyticsMinorAmount'
        children:
          type: array
          description: Expense subcategory totals. Child buckets and income buckets have empty children.
          items:
            $ref: '#/components/schemas/AnalyticsBucket'
    MonthlyAnalytics:
      type: object
      required: [month, currency, timezone, income_minor, expense_minor, income, expenses]
      additionalProperties: false
      properties:
        month:
          type: string
          example: '2026-10'
        currency:
          $ref: '#/components/schemas/Currency'
        timezone:
          type: string
          example: Asia/Qyzylorda
        income_minor:
          $ref: '#/components/schemas/AnalyticsMinorAmount'
        expense_minor:
          $ref: '#/components/schemas/AnalyticsMinorAmount'
        income:
          type: array
          items:
            $ref: '#/components/schemas/AnalyticsBucket'
        expenses:
          type: array
          items:
            $ref: '#/components/schemas/AnalyticsBucket'
    CreateTransaction:
      type: object
      required: [account_id, kind, amount_minor, occurred_at]
      additionalProperties: false
      properties:
        account_id:
          type: string
          format: uuid
        kind:
          $ref: '#/components/schemas/TransactionKind'
        category_id:
          $ref: '#/components/schemas/NullableCategoryID'
        amount_minor:
          $ref: '#/components/schemas/PositiveMinorAmount'
        note:
          type: string
          maxLength: 500
          default: ''
          description: At most 500 Unicode characters.
        occurred_at:
          type: string
          format: date-time
          description: RFC3339 timestamp with a timezone, year 0001 through 9999.
    Transaction:
      type: object
      required:
      - id
      - account_id
      - kind
      - amount_minor
      - currency
      - note
      - occurred_at
      - created_at
      - version
      - deleted_at
      - transfer_id

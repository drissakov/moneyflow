      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        account_id:
          type: string
          format: uuid
        kind:
          $ref: '#/components/schemas/TransactionKind'
        category_id:
          $ref: '#/components/schemas/NullableCategoryID'
        exclude_from_analytics:
          type: boolean
          default: false
          description: Explicit imported own-account/cash movement. Affects the ledger balance but is omitted from income/expense
            analytics. Omitted when false.
        amount_minor:
          $ref: '#/components/schemas/PositiveMinorAmount'
        currency:
          $ref: '#/components/schemas/Currency'
        note:
          type: string
        occurred_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        version:
          type: integer
          format: int64
          minimum: 1
        deleted_at:
          type: string
          format: date-time
          nullable: true
        transfer_id:
          type: string
          format: uuid
          nullable: true
        transfer_role:
          type: string
          enum:
          - from
          - to
          - fee
          nullable: true
        source:
          type: string
          enum:
          - manual
          - import
          - transfer
        import_id:
          type: string
          format: uuid
          nullable: true

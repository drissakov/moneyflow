name: moneyflow-free-backup-test
services:
  source-db:
    image: postgres:18.6-alpine3.23
    environment:
      POSTGRES_USER: source_admin
      POSTGRES_PASSWORD: source-test-password
      POSTGRES_DB: moneyflow_fixture
    tmpfs:
      - /var/lib/postgresql:size=256m,mode=0700,uid=70,gid=70
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U source_admin -d moneyflow_fixture"]
      interval: 2s
      timeout: 2s
      retries: 30
  restore-db:
    image: postgres:18.6-alpine3.23
    environment:
      POSTGRES_USER: restore_admin
      POSTGRES_PASSWORD: restore-test-password
    tmpfs:
      - /var/lib/postgresql:size=256m,mode=0700,uid=70,gid=70
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U restore_admin -d postgres"]
      interval: 2s
      timeout: 2s
      retries: 30
  test:
    build:
      context: ../../..
      dockerfile: infra/backup/Dockerfile.free
    entrypoint: ["/bin/bash", "/tests/free-integration.sh"]
    environment:
      PGHOST: source-db
      PGUSER: source_admin
      PGDATABASE: moneyflow_fixture
      PGPASSWORD_FILE: /work/secrets/postgres_password
      RESTORE_PGHOST: restore-db
      RESTORE_PGUSER: restore_admin
      RESTORE_PGPASSWORD_FILE: /work/secrets/restore_db_password
    volumes:
      - ./:/tests:ro
      - ../../../backend/internal/migrations/sql:/migrations:ro
    tmpfs:
      - /work:size=256m,mode=0700
      - /output:size=24m,mode=0755
    depends_on:
      source-db:
        condition: service_healthy
      restore-db:
        condition: service_healthy

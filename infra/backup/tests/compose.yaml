# Disposable, local encrypted repository: never reads production credentials.
name: moneyflow-backup-test
services:
  source-db:
    image: postgres:17.11-alpine3.23
    environment:
      POSTGRES_USER: source_admin
      POSTGRES_PASSWORD: source-test-password
      POSTGRES_DB: moneyflow_fixture
    tmpfs:
      - /var/lib/postgresql/data:size=256m,mode=0700,uid=70,gid=70
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U source_admin -d moneyflow_fixture"]
      interval: 2s
      timeout: 2s
      retries: 30
  restore-db:
    image: postgres:17.11-alpine3.23
    environment:
      POSTGRES_USER: restore_admin
      POSTGRES_PASSWORD: restore-test-password
    tmpfs:
      - /var/lib/postgresql/data:size=256m,mode=0700,uid=70,gid=70
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U restore_admin -d postgres"]
      interval: 2s
      timeout: 2s
      retries: 30
  test:
    build:
      context: ../../..
      dockerfile: infra/backup/Dockerfile
    entrypoint: ["/bin/bash", "/tests/integration.sh"]
    environment:
      PGHOST: source-db
      PGUSER: source_admin
      PGDATABASE: moneyflow_fixture
      PGPASSWORD_FILE: /work/secrets/postgres_password
      RESTORE_PGHOST: restore-db
      RESTORE_PGUSER: restore_admin
      RESTORE_PGPASSWORD_FILE: /work/secrets/restore_db_password
      RESTIC_REPOSITORY: /repository
      RESTIC_PASSWORD_FILE: /work/secrets/restic_password
    volumes:
      - ./:/tests:ro
      - ../../../backend/internal/migrations/sql:/migrations:ro
    tmpfs:
      - /work:size=256m,mode=0700
      - /state:size=1m,mode=0700
      - /metrics:size=1m,mode=0755
      - /repository:size=256m,mode=0700
    depends_on:
      source-db:
        condition: service_healthy
      restore-db:
        condition: service_healthy

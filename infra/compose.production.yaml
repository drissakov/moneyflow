# Standalone configuration: use this file alone, without the local Compose file.
name: moneyflow-production

x-backend: &backend
  image: moneyflow-backend:production
  build:
    context: ..
    dockerfile: infra/backend.Dockerfile
  environment:
    # The hostname inside this stack is db. URL-encode special password characters.
    DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL with the private db hostname}
    PORT: "8080"
    SESSION_TTL: ${SESSION_TTL:?Set SESSION_TTL explicitly}
    APP_ENV: production
    # Trust only the Caddy container, never arbitrary forwarded client headers.
    TRUSTED_PROXIES: ${CADDY_PRIVATE_IP:-172.30.50.10}
    GIN_MODE: release
  init: true
  read_only: true
  tmpfs:
    - /tmp:size=16m,mode=1777
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  networks:
    - private

services:
  db:
    image: postgres:17.11-alpine3.23
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a strong POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped
    networks:
      - private

  migrate:
    <<: *backend
    entrypoint: ["/app/migrate"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    <<: *backend
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/readyz"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  caddy:
    image: caddy:2.11.7-alpine
    environment:
      DOMAIN: ${DOMAIN:?Set the public API domain}
      ACME_EMAIL: ${ACME_EMAIL:?Set the certificate contact email}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    networks:
      public: {}
      private:
        ipv4_address: ${CADDY_PRIVATE_IP:-172.30.50.10}

volumes:
  postgres_data:
  caddy_data:
  caddy_config:

networks:
  private:
    internal: true
    ipam:
      config:
        - subnet: ${PRIVATE_NETWORK_SUBNET:-172.30.50.0/24}
  public:

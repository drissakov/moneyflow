# Standalone configuration: use this file alone, without the local Compose file.
name: moneyflow-production

x-backend: &backend
  image: ${MONEYFLOW_BACKEND_IMAGE:-moneyflow-backend:production}
  build:
    context: ..
    dockerfile: infra/backend.Dockerfile
  environment: &backend-environment
    DATABASE_URL_FILE: /run/secrets/database_url
    PORT: "8080"
    SESSION_TTL: ${SESSION_TTL:?Set SESSION_TTL explicitly}
    FRANKFURTER_URL: ${FRANKFURTER_URL:-https://api.frankfurter.dev/v2}
    FX_CACHE_TTL: ${FX_CACHE_TTL:-6h}
    FX_MAX_STALE: ${FX_MAX_STALE:-168h}
    APP_ENV: production
    # Trust only the Caddy container, never arbitrary forwarded client headers.
    TRUSTED_PROXIES: ${CADDY_PRIVATE_IP:-172.30.50.10}
    GIN_MODE: release
  secrets:
    - database_url
  init: true
  read_only: true
  tmpfs:
    - /tmp:size=16m,mode=1777
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  networks:
    - private

services:
  db:
    image: postgres:17.11-alpine3.23
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped
    networks:
      - private

  migrate:
    <<: *backend
    entrypoint: ["/app/migrate"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    <<: *backend
    environment:
      <<: *backend-environment
      METRICS_PORT: "9090"
    # Allows outbound provider HTTPS; API still has no published port.
    networks:
      - private
      - egress
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/readyz"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  caddy:
    image: caddy:2.11.7-alpine
    environment:
      DOMAIN: ${DOMAIN:?Set the public API domain}
      ACME_EMAIL: ${ACME_EMAIL:?Set the certificate contact email}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    networks:
      public: {}
      private:
        ipv4_address: ${CADDY_PRIVATE_IP:-172.30.50.10}

  # Disposable verifier can only be reached by the backup service, not by the API.
  restore-db:
    image: postgres:17.11-alpine3.23
    environment:
      POSTGRES_USER: moneyflow_verify
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/restore_db_password
    secrets:
      - restore_db_password
    tmpfs:
      - /var/lib/postgresql/data:size=512m,mode=0700
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U moneyflow_verify -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped
    networks:
      - backup-verification

  backup:
    image: moneyflow-backup:production
    build:
      context: ..
      dockerfile: infra/backup/Dockerfile
    command: ["schedule"]
    environment:
      PGHOST: db
      PGPORT: "5432"
      PGUSER: ${POSTGRES_USER:?Set POSTGRES_USER}
      PGDATABASE: ${POSTGRES_DB:?Set POSTGRES_DB}
      PGPASSWORD_FILE: /run/secrets/postgres_password
      RESTIC_REPOSITORY: ${RESTIC_REPOSITORY:?Set the offsite S3 repository}
      RESTIC_PASSWORD_FILE: /run/secrets/restic_password
      AWS_ACCESS_KEY_ID_FILE: /run/secrets/backup_s3_access_key
      AWS_SECRET_ACCESS_KEY_FILE: /run/secrets/backup_s3_secret_key
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-auto}
      RESTORE_PGHOST: restore-db
      RESTORE_PGPORT: "5432"
      RESTORE_PGUSER: moneyflow_verify
      RESTORE_PGPASSWORD_FILE: /run/secrets/restore_db_password
      BACKUP_HOST: moneyflow-production
      BACKUP_UTC_TIME: ${BACKUP_UTC_TIME:-03:00}
      BACKUP_RUN_ON_START: ${BACKUP_RUN_ON_START:-true}
      KEEP_DAILY: ${KEEP_DAILY:-7}
      KEEP_WEEKLY: ${KEEP_WEEKLY:-4}
      KEEP_MONTHLY: ${KEEP_MONTHLY:-6}
    secrets:
      - postgres_password
      - restic_password
      - backup_s3_access_key
      - backup_s3_secret_key
      - restore_db_password
    volumes:
      - backup_state:/state
      - backup_metrics:/metrics
    tmpfs:
      - /work:size=768m,mode=0700
      - /tmp:size=16m,mode=1777
    init: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "/opt/moneyflow-backup/entrypoint.sh", "health"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 60s
    depends_on:
      db:
        condition: service_healthy
      restore-db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - private
      - backup-verification
      - egress

  prometheus:
    image: prom/prometheus:v3.15.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=14d
      - --storage.tsdb.retention.size=1GB
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
    networks:
      - private

  alertmanager:
    image: prom/alertmanager:v0.34.1
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    ports:
      - "127.0.0.1:9093:9093"
    volumes:
      - ./monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
    networks:
      - private
      # Required only when the owner configures an HTTPS alert receiver.
      - egress

  grafana:
    image: grafana/grafana:13.2.3
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    secrets:
      - grafana_admin_password
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    tmpfs:
      - /tmp:size=32m,mode=1777
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      - prometheus
    restart: unless-stopped
    networks:
      - private

  node-exporter:
    image: prom/node-exporter:v1.12.1
    command:
      - --collector.disable-defaults
      - --collector.textfile
      - --collector.textfile.directory=/metrics
    volumes:
      - backup_metrics:/metrics:ro
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
    networks:
      - private

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
  backup_state:
  backup_metrics:
  prometheus_data:
  alertmanager_data:
  grafana_data:

secrets:
  postgres_password:
    file: ../secrets/postgres_password
  database_url:
    file: ../secrets/database_url
  restic_password:
    file: ../secrets/restic_password
  backup_s3_access_key:
    file: ../secrets/backup_s3_access_key
  backup_s3_secret_key:
    file: ../secrets/backup_s3_secret_key
  restore_db_password:
    file: ../secrets/restore_db_password
  grafana_admin_password:
    file: ../secrets/grafana_admin_password

networks:
  private:
    internal: true
    ipam:
      config:
        - subnet: ${PRIVATE_NETWORK_SUBNET:-172.30.50.0/24}
  public:
  egress:
  backup-verification:
    internal: true
